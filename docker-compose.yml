services:
  seguridad-db:
    image: postgres:16-alpine
    container_name: seguridad-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - seguridad-net

  seguridad-mail:
    image: mailhog/mailhog:latest
    container_name: seguridad-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - seguridad-net

  seguridad-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seguridad-backend
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: seguridad-db
      DB_PORT: 5432
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      EMAIL_HOST: seguridad-mail
      EMAIL_PORT: 1025
    depends_on:
      seguridad-db:
        condition: service_healthy
      seguridad-mail:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - seguridad-net

  seguridad-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: seguridad-frontend
    restart: unless-stopped
    depends_on:
      - seguridad-backend
    ports:
      - "3000:80"
    networks:
      - seguridad-net

volumes:
  pgdata:

networks:
  seguridad-net:
    driver: bridge